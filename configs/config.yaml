random_state: 42
test_size: 0.20

models:
  logistic_regression:
    max_iter: 500
    class_weight: balanced
  xgboost:
    n_estimators: 350
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.80

profitability:
  lgd: 0.45
  operating_cost: 100
  revenue_rate: 0.12

segmentation:
  n_clusters: 4
